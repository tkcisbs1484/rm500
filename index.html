<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Artisan Pro v6 Stable RoR</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px;margin:4px;border-radius:8px;border:0;background:#222;color:#fff}
input{padding:8px;margin:4px;width:70px}
#time{font-size:42px;text-align:center}
canvas{width:100%;height:520px;border:2px solid #000;background:#fff;cursor:pointer}
</style>
</head>

<body>

<div class="card">
<div id="time">0:00</div>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="resetTimer()">Reset</button>
<button onclick="shift(-5)">-5s</button>
<button onclick="shift(5)">+5s</button>
</div>

<div class="card">
BT
<button onclick="step('bt',-1)">-</button>
<input id="bt">
<button onclick="step('bt',1)">+</button>

PW
<button onclick="step('pw',-5)">-</button>
<input id="pw">
<button onclick="step('pw',5)">+</button>

FAN
<button onclick="step('fan',-5)">-</button>
<input id="fan">
<button onclick="step('fan',5)">+</button>

<button onclick="save()">Save</button>
</div>

<div class="card">
<canvas id="c" width="1200" height="560"></canvas>
</div>

<script>
let running=false,startT=0,base=0;
let rows=[],hit=[];

const ctx=c.getContext("2d");

function now(){return running?base+Math.floor((Date.now()-startT)/1000):base}
function fmt(s){let m=Math.floor(s/60),sec=s%60;return m+":"+("0"+sec).slice(-2)}

function start(){if(running)return;running=true;startT=Date.now();loop()}
function stop(){base=now();running=false;draw()}
function resetTimer(){base=0;running=false;draw()}
function shift(d){base=Math.max(0,now()+d);if(running)startT=Date.now();draw()}

function loop(){time.innerText=fmt(now());draw();if(running)requestAnimationFrame(loop)}

function step(id,val){
let e=document.getElementById(id);
let v=parseFloat(e.value)||0;
e.value=v+val;
}

function save(){
rows.push({
t:now(),
bt:parseFloat(bt.value),
pw:parseFloat(pw.value),
fan:parseFloat(fan.value)
});
rows.sort((a,b)=>a.t-b.t);
draw();
}

function btRows(){return rows.filter(r=>!isNaN(r.bt))}

function interp(t){
let b=btRows();
if(b.length<2)return null;

for(let i=1;i<b.length;i++){
let p=b[i-1],c=b[i];
if(p.t<=t&&t<=c.t){
let r=(t-p.t)/(c.t-p.t);
return p.bt+(c.bt-p.bt)*r;
}}
return b[b.length-1].bt;
}

/* 🔥 安定版RoR */
function ror(){
let out=[];
for(let t=30;t<=840;t+=5){
let a=interp(t),b=interp(t-30);
if(a!=null&&b!=null){

let v=(a-b)/0.5;

/* 跳ね防止 */
v=Math.max(0,Math.min(18,v));

out.push({t,v});
}}
return smooth(out);
}

/* 🔥 強スムージング */
function smooth(r){
return r.map((p,i)=>{
let vals=[];
for(let j=i-4;j<=i+4;j++){
if(r[j])vals.push(r[j].v);
}
return {t:p.t,v:vals.reduce((a,b)=>a+b)/vals.length};
});
}

function draw(){
hit=[];
ctx.clearRect(0,0,c.width,c.height);

let L=70,W=1000,H=430,T=25;

let x=t=>L+(t/840)*W;
let y=v=>T+H-(v/230)*H;
let yR=v=>T+H-(v/30)*H;

/* grid */
for(let i=0;i<=230;i+=10){
let yy=y(i);
ctx.strokeStyle="#eee";
ctx.beginPath();
ctx.moveTo(L,yy);
ctx.lineTo(L+W,yy);
ctx.stroke();
}

for(let s=0;s<=840;s+=30){
let xx=x(s);
ctx.strokeStyle="#ddd";
ctx.beginPath();
ctx.moveTo(xx,T);
ctx.lineTo(xx,T+H);
ctx.stroke();
}

/* BT */
let b=btRows();
ctx.beginPath();
b.forEach((p,i)=>{
let xx=x(p.t),yy=y(p.bt);
if(i==0)ctx.moveTo(xx,yy);
else ctx.lineTo(xx,yy);
});
ctx.strokeStyle="#000";
ctx.stroke();

/* 点 */
b.forEach(p=>{
let xx=x(p.t),yy=y(p.bt);
ctx.beginPath();
ctx.arc(xx,yy,5,0,Math.PI*2);
ctx.fill();

hit.push({p,xx,yy});
});

/* RoR */
let rr=ror();
ctx.beginPath();
rr.forEach((p,i)=>{
let xx=x(p.t),yy=yR(p.v);
if(i==0)ctx.moveTo(xx,yy);
else ctx.lineTo(xx,yy);
});
ctx.strokeStyle="orange";
ctx.globalAlpha=0.5;
ctx.stroke();
ctx.globalAlpha=1;
}

/* 点クリック編集 */
c.onclick=e=>{
let rect=c.getBoundingClientRect();
let mx=e.clientX-rect.left;
let my=e.clientY-rect.top;

hit.forEach(h=>{
if(Math.hypot(mx-h.xx,my-h.yy)<10){
let val=prompt("BT",h.p.bt);
if(val==="del"){rows=rows.filter(r=>r!==h.p)}
else if(val!=null){h.p.bt=parseFloat(val)}
draw();
}
});
}

draw();
</script>

</body>
</html>
