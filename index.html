<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Logger Base v7</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px;margin:4px;border-radius:8px;border:0;background:#222;color:#fff}
input{padding:8px;margin:4px;width:90px}
#time{font-size:42px;text-align:center;font-weight:bold}
canvas{width:100%;height:430px;border:2px solid #000;border-radius:10px;background:#fff}
</style>
</head>

<body>

<!-- 🔥 タイマー -->
<div class="card">
  <div id="time">0:00</div>
  <button onclick="startTimer()">Start</button>
  <button onclick="stopTimer()">Stop</button>
  <button onclick="resetTimer()">Reset</button>
  <button onclick="shift(-10)">-10s</button>
  <button onclick="shift(10)">+10s</button>
</div>

<!-- 🔥 入力フォーム（ここだけ表示される） -->
<div class="card">
  BT <input id="bt" type="number">
  Power <input id="power" type="number">
  Fan <input id="fan" type="number">
  <button onclick="save()">Save</button>
</div>

<!-- 🔥 グラフ -->
<div class="card">
  <canvas id="c" width="1100" height="520"></canvas>
</div>

<script>
let running=false,startMs=0,base=0,data=[];
const timeEl=document.getElementById("time");
const ctx=document.getElementById("c").getContext("2d");

function now(){
  return running ? base + Math.floor((Date.now()-startMs)/1000) : base;
}

function fmt(s){
  let m=Math.floor(s/60),sec=s%60;
  return m+":"+("0"+sec).slice(-2);
}

function startTimer(){
  if(running)return;
  running=true;
  startMs=Date.now();
  loop();
}

function stopTimer(){
  base=now();
  running=false;
}

function resetTimer(){
  base=0;
  running=false;
  timeEl.innerText="0:00";
  draw();
}

function shift(v){
  base=Math.max(0,now()+v);
  if(running)startMs=Date.now();
}

function loop(){
  timeEl.innerText=fmt(now());
  draw();
  if(running)requestAnimationFrame(loop);
}

function save(){
  let t=now();
  let bt=parseFloat(document.getElementById("bt").value);
  let power=parseFloat(document.getElementById("power").value);
  let fan=parseFloat(document.getElementById("fan").value);

  if(isNaN(bt)&&isNaN(power)&&isNaN(fan))return;

  data.push({t,bt,power,fan});
  data.sort((a,b)=>a.t-b.t);
}

/* 🔥 実測のみ */
function getBTBefore(sec){
  let b=data.filter(d=>!isNaN(d.bt)).sort((a,b)=>a.t-b.t);
  let found=null;

  for(let i=0;i<b.length;i++){
    if(b[i].t<=sec){
      found=b[i];
    }
  }
  return found ? found.bt : null;
}

function calcROR(){
  let out=[];
  let b=data.filter(d=>!isNaN(d.bt)).sort((a,b)=>a.t-b.t);

  for(let i=0;i<b.length;i++){
    let nowT=b[i].t;
    let nowBT=b[i].bt;
    let prevBT=getBTBefore(nowT-60);

    if(prevBT===null)continue;

    out.push({
      t:nowT,
      ror:nowBT-prevBT
    });
  }

  return out;
}

function draw(){
  ctx.clearRect(0,0,1100,520);

  let L=70,T=20,W=950,H=420;
  let maxTime=14*60;

  let x=t=>L+(t/maxTime)*W;
  let yBT=v=>T+H-(v/230)*H;
  let yROR=v=>T+H-(Math.max(0,Math.min(30,v))/30)*H;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,1100,520);

  /* grid */
  for(let temp=0;temp<=230;temp+=10){
    let y=yBT(temp);
    ctx.strokeStyle="#eee";
    ctx.beginPath();
    ctx.moveTo(L,y);
    ctx.lineTo(L+W,y);
    ctx.stroke();
  }

  for(let s=0;s<=maxTime;s+=60){
    let xx=x(s);
    ctx.strokeStyle="#ddd";
    ctx.beginPath();
    ctx.moveTo(xx,T);
    ctx.lineTo(xx,T+H);
    ctx.stroke();
  }

  /* BT */
  let b=data.filter(d=>!isNaN(d.bt));

  if(b.length){
    ctx.strokeStyle="#000";
    ctx.lineWidth=3;
    ctx.beginPath();

    b.forEach((d,i)=>{
      let xx=x(d.t),yy=yBT(d.bt);
      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
  }

  /* 🔥 RoR */
  let rr=calcROR();

  if(rr.length){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="orange";
    ctx.lineWidth=3;
    ctx.beginPath();

    rr.forEach((d,i)=>{
      let xx=x(d.t),yy=yROR(d.ror);
      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
    ctx.restore();
  }
}

draw();
</script>

</body>
</html>
