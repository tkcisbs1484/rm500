<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Logger New v2</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px;margin:4px;border-radius:8px;border:0;background:#222;color:#fff}
input{padding:8px;margin:4px;width:90px}
#time{font-size:42px;text-align:center}
canvas{width:100%;height:430px;border:2px solid #000;border-radius:10px;background:#fff}
</style>
</head>

<body>

<div class="card">
<div id="time">0:00</div>
<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>
<button onclick="resetTimer()">Reset</button>
<button onclick="shift(-10)">-10s</button>
<button onclick="shift(10)">+10s</button>
</div>

<div class="card">
BT <input id="bt">
Power <input id="power">
Fan <input id="fan">
<button onclick="save()">Save</button>
</div>

<canvas id="c" width="1100" height="520"></canvas>

<script>
let running=false,start=0,base=0,data=[];
const ctx=c.getContext("2d");

function now(){
  return running ? base + Math.floor((Date.now()-start)/1000) : base;
}

function fmt(s){
  let m=Math.floor(s/60),sec=s%60;
  return m+":"+("0"+sec).slice(-2);
}

function startTimer(){
  if(running)return;
  running=true;
  start=Date.now();
  loop();
}

function stopTimer(){
  base=now();
  running=false;
}

function resetTimer(){
  base=0;
  running=false;
  time.innerText="0:00";
  draw();
}

function shift(v){
  base=Math.max(0,now()+v);
  if(running)start=Date.now();
}

function loop(){
  time.innerText=fmt(now());
  draw();
  if(running)requestAnimationFrame(loop);
}

function save(){
  let t=now();
  let bt=parseFloat(bt.value);
  let power=parseFloat(power.value);
  let fan=parseFloat(fan.value);

  if(isNaN(bt)&&isNaN(power)&&isNaN(fan))return;

  data.push({t,bt,power,fan});
  data.sort((a,b)=>a.t-b.t);
}

/* 実測BT */
function getBTBefore(sec){
  let b=data.filter(d=>!isNaN(d.bt)).sort((a,b)=>a.t-b.t);
  let found=null;
  for(let i=0;i<b.length;i++){
    if(b[i].t<=sec)found=b[i];
  }
  return found ? found.bt : null;
}

/* 🔥 RoR（全時間対応） */
function calcROR(maxTime){
  let out=[];

  for(let sec=60; sec<=maxTime; sec+=60){
    let nowBT=getBTBefore(sec);
    let prevBT=getBTBefore(sec-60);

    if(nowBT===null||prevBT===null)continue;

    out.push({
      t:sec,
      ror:nowBT-prevBT
    });
  }

  return out;
}

function draw(){

  let L=70,T=20,R=60,B=55;
  let W=c.width-L-R;
  let H=c.height-T-B;

  ctx.clearRect(0,0,c.width,c.height);

  /* 🔥 最大時間を動的に */
  let maxTime=Math.max(14*60, ...data.map(d=>d.t||0), now());

  let x=t=>L+(t/maxTime)*W;
  let yBT=v=>T+H-(v/230)*H;
  let yROR=v=>T+H-(Math.max(0,Math.min(30,v))/30)*H;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.font="13px Arial";

  /* 温度線 */
  for(let i=0;i<=230;i+=10){
    let y=yBT(i);
    ctx.strokeStyle="#eee";
    ctx.beginPath();
    ctx.moveTo(L,y);
    ctx.lineTo(L+W,y);
    ctx.stroke();
  }

  /* 時間線 */
  let maxMin=Math.ceil(maxTime/60);
  for(let m=0;m<=maxMin;m++){
    let xx=x(m*60);
    ctx.strokeStyle="#ddd";
    ctx.beginPath();
    ctx.moveTo(xx,T);
    ctx.lineTo(xx,T+H);
    ctx.stroke();
    ctx.fillText(m+"m",xx-10,T+H+20);
  }

  /* BT */
  let b=data.filter(d=>!isNaN(d.bt));

  if(b.length){
    ctx.strokeStyle="#000";
    ctx.lineWidth=3;
    ctx.beginPath();

    b.forEach((d,i)=>{
      let xx=x(d.t),yy=yBT(d.bt);
      if(i==0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
  }

  /* 🔥 RoR */
  let rr=calcROR(maxTime);

  if(rr.length){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="orange";
    ctx.lineWidth=3;
    ctx.beginPath();

    rr.forEach((d,i)=>{
      let xx=x(d.t),yy=yROR(d.ror);
      if(i==0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
    ctx.restore();
  }
}

draw();
</script>

</body>
</html>
