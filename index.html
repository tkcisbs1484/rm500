<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Logger Artisan RoR v1</title>
<style>
body{margin:0;background:#f5f5f5;font-family:Arial;color:#222}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px 14px;margin:4px;border:0;border-radius:8px;background:#222;color:#fff;font-size:15px}
button.event{background:#8a4b08}
input{padding:8px;margin:4px;width:90px;font-size:15px}
#time{font-size:44px;text-align:center;font-weight:bold}
canvas{width:100%;height:430px;background:white;border:2px solid #000;border-radius:10px}
</style>
</head>
<body>

<div class="card">
  <div id="time">0:00</div>
  <button onclick="startTimer()">Start</button>
  <button onclick="stopTimer()">Stop</button>
  <button onclick="resetTimer()">Reset</button>
  <button onclick="shiftTime(-10)">-10s</button>
  <button onclick="shiftTime(10)">+10s</button>
</div>

<div class="card">
  BT <input id="bt" type="number" step="1">
  Power <input id="power" type="number" step="5">
  Fan <input id="fan" type="number" step="5">
  <button onclick="savePoint()">Save</button>
</div>

<div class="card">
  <button class="event" onclick="markEvent('Charge')">Charge</button>
  <button class="event" onclick="markEvent('Bottom')">Bottom</button>
  <button class="event" onclick="markEvent('GC')">GC</button>
  <button class="event" onclick="markEvent('FC')">1st Crack</button>
  <button class="event" onclick="markEvent('Drop')">Drop</button>
</div>

<div class="card">
  <canvas id="graph" width="1100" height="520"></canvas>
</div>

<script>
let running=false;
let startMs=0;
let baseSec=0;
let data=[];
let events={};

const DELTA_SPAN=30;      // Artisan風 Delta Span
const SMOOTH_WINDOW=3;    // RoR smoothing

const timeEl=document.getElementById("time");
const canvas=document.getElementById("graph");
const ctx=canvas.getContext("2d");

function nowSec(){
  return running ? baseSec + Math.floor((Date.now()-startMs)/1000) : baseSec;
}

function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  let m=Math.floor(sec/60);
  let s=sec%60;
  return m+":"+String(s).padStart(2,"0");
}

function startTimer(){
  if(running)return;
  running=true;
  startMs=Date.now();
  loop();
}

function stopTimer(){
  baseSec=nowSec();
  running=false;
  timeEl.innerText=fmt(baseSec);
  draw();
}

function resetTimer(){
  baseSec=0;
  running=false;
  timeEl.innerText="0:00";
  draw();
}

function shiftTime(delta){
  baseSec=Math.max(0,nowSec()+delta);
  if(running)startMs=Date.now();
  timeEl.innerText=fmt(baseSec);
  draw();
}

function loop(){
  timeEl.innerText=fmt(nowSec());
  draw();
  if(running)requestAnimationFrame(loop);
}

function savePoint(){
  let t=nowSec();
  let bt=parseFloat(document.getElementById("bt").value);
  let power=parseFloat(document.getElementById("power").value);
  let fan=parseFloat(document.getElementById("fan").value);

  if(isNaN(bt)&&isNaN(power)&&isNaN(fan))return;

  data.push({t,bt,power,fan});
  data.sort((a,b)=>a.t-b.t);
  draw();
}

function markEvent(name){
  events[name]=nowSec();
  draw();
}

function btData(){
  return data.filter(d=>!isNaN(d.bt)).sort((a,b)=>a.t-b.t);
}

function getInterpolatedBT(sec){
  let b=btData();
  if(b.length===0)return null;
  if(sec<b[0].t)return null;
  if(sec>=b[b.length-1].t)return b[b.length-1].bt;

  for(let i=1;i<b.length;i++){
    let prev=b[i-1];
    let cur=b[i];

    if(prev.t<=sec && sec<=cur.t){
      let span=cur.t-prev.t;
      if(span<=0)return cur.bt;
      let ratio=(sec-prev.t)/span;
      return prev.bt+(cur.bt-prev.bt)*ratio;
    }
  }

  return null;
}

function calcArtisanRoR(){
  let out=[];
  let b=btData();
  if(b.length<2)return out;

  let start=Math.ceil((b[0].t+DELTA_SPAN)/5)*5;
  let end=Math.floor(b[b.length-1].t/5)*5;

  for(let sec=start;sec<=end;sec+=5){
    let nowBT=getInterpolatedBT(sec);
    let prevBT=getInterpolatedBT(sec-DELTA_SPAN);

    if(nowBT===null||prevBT===null)continue;

    let ror=(nowBT-prevBT)/(DELTA_SPAN/60);

    out.push({t:sec,ror});
  }

  return smoothRoR(out);
}

function smoothRoR(points){
  let out=[];

  for(let i=0;i<points.length;i++){
    let vals=[];
    let half=Math.floor(SMOOTH_WINDOW/2);

    for(let j=i-half;j<=i+half;j++){
      if(j>=0&&j<points.length){
        vals.push(points[j].ror);
      }
    }

    out.push({
      t:points[i].t,
      ror:vals.reduce((a,b)=>a+b,0)/vals.length
    });
  }

  return out;
}

function stepLine(points,valueKey,x,y){
  if(points.length===0)return;

  ctx.beginPath();
  let prev=points[0];
  ctx.moveTo(x(prev.t),y(prev[valueKey]));

  for(let i=1;i<points.length;i++){
    let cur=points[i];
    ctx.lineTo(x(cur.t),y(prev[valueKey]));
    ctx.lineTo(x(cur.t),y(cur[valueKey]));
    prev=cur;
  }

  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let L=70,R=60,T=25,B=55;
  let W=canvas.width-L-R;
  let H=canvas.height-T-B;

  let maxTime=Math.max(14*60,nowSec(),...data.map(d=>d.t||0));
  let maxTemp=230;
  let maxRor=30;

  let x=sec=>L+(sec/maxTime)*W;
  let yTemp=temp=>T+H-(temp/maxTemp)*H;
  let yRor=ror=>T+H-(Math.max(0,Math.min(maxRor,ror))/maxRor)*H;

  let pfTop=T+H*(2/3);
  let pfH=H/3;
  let yPF=v=>pfTop+pfH-(Math.max(0,Math.min(100,v))/100)*pfH;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.font="13px Arial";
  ctx.textBaseline="middle";

  for(let temp=0;temp<=230;temp+=5){
    let yy=yTemp(temp);
    ctx.strokeStyle=temp%10===0 ? "#ddd" : "#eee";
    ctx.beginPath();
    ctx.moveTo(L,yy);
    ctx.lineTo(L+W,yy);
    ctx.stroke();

    if(temp%10===0){
      ctx.fillStyle="#000";
      ctx.fillText(temp+"C",10,yy);
    }
  }

  let maxMin=Math.ceil(maxTime/60);
  for(let sec=0;sec<=maxTime;sec+=30){
    let xx=x(sec);
    ctx.strokeStyle=sec%60===0 ? "#ddd" : "#f0f0f0";
    ctx.beginPath();
    ctx.moveTo(xx,T);
    ctx.lineTo(xx,T+H);
    ctx.stroke();

    if(sec%60===0){
      ctx.fillStyle="#000";
      ctx.fillText((sec/60)+"m",xx-10,T+H+25);
    }
  }

  ctx.strokeStyle="rgba(0,0,0,0.3)";
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(L,pfTop);
  ctx.lineTo(L+W,pfTop);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle="#000";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(L,T);
  ctx.lineTo(L,T+H);
  ctx.lineTo(L+W,T+H);
  ctx.lineTo(L+W,T);
  ctx.stroke();

  ctx.fillStyle="#666";
  ctx.font="12px Arial";
  for(let r=0;r<=30;r+=5){
    let yy=yRor(r);
    ctx.fillText(r,L+W+14,yy);
  }
  ctx.fillText("RoR",L+W+14,T+14);

  Object.keys(events).forEach(name=>{
    let t=events[name];
    let xx=x(t);

    ctx.strokeStyle="#b36b00";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(xx,T);
    ctx.lineTo(xx,T+H);
    ctx.stroke();

    ctx.fillStyle="#b36b00";
    ctx.save();
    ctx.translate(xx+6,T+25);
    ctx.rotate(Math.PI/2);
    ctx.fillText(name+" "+fmt(t),0,0);
    ctx.restore();
  });

  let b=btData();
  if(b.length>0){
    ctx.strokeStyle="#000";
    ctx.lineWidth=3;
    ctx.beginPath();

    b.forEach((d,i)=>{
      let xx=x(d.t);
      let yy=yTemp(d.bt);

      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();

    ctx.fillStyle="#000";
    ctx.font="14px Arial";

    b.forEach(d=>{
      let xx=x(d.t);
      let yy=yTemp(d.bt);

      ctx.beginPath();
      ctx.arc(xx,yy,5,0,Math.PI*2);
      ctx.fill();

      ctx.fillText(Math.round(d.bt)+"C",xx+7,yy-10);
    });
  }

  let rr=calcArtisanRoR();
  if(rr.length>0){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="orange";
    ctx.lineWidth=3;
    ctx.beginPath();

    rr.forEach((d,i)=>{
      let xx=x(d.t);
      let yy=yRor(d.ror);

      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
    ctx.restore();
  }

  let powerData=data.filter(d=>!isNaN(d.power)).sort((a,b)=>a.t-b.t);
  if(powerData.length>0){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="red";
    ctx.lineWidth=3;
    stepLine(powerData,"power",x,yPF);
    ctx.restore();
  }

  let fanData=data.filter(d=>!isNaN(d.fan)).sort((a,b)=>a.t-b.t);
  if(fanData.length>0){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="blue";
    ctx.lineWidth=3;
    stepLine(fanData,"fan",x,yPF);
    ctx.restore();
  }

  ctx.fillStyle="#000";
  ctx.font="14px Arial";
  ctx.fillText("Artisan-style RoR: Delta Span 30s / Orange 50%",L+10,T+18);
}

draw();
</script>

</body>
</html>
