<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Artisan Pro v5</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px;margin:4px;border:0;border-radius:8px;background:#222;color:#fff}
.event{background:#8a4b08}
input,select{padding:8px;margin:4px}
#time{font-size:42px;text-align:center}
canvas{width:100%;height:520px;border:2px solid #000;background:#fff}
.metric{display:inline-block;margin:5px;padding:8px;background:#eee;border-radius:6px}
</style>
</head>

<body>

<div class="card">
<div id="time">0:00</div>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="resetTimer()">Reset</button>
<button onclick="shift(-10)">-10s</button>
<button onclick="shift(10)">+10s</button>
</div>

<div class="card">
BT <input id="bt">
Power <input id="pw">
Fan <input id="fan">
<button onclick="save()">Save</button>
</div>

<div class="card">
<button class="event" onclick="mark('Charge')">Charge</button>
<button class="event" onclick="mark('Bottom')">Bottom</button>
<button class="event" onclick="mark('GC')">GC</button>
<button class="event" onclick="mark('FC')">1C</button>
<button class="event" onclick="mark('Drop')">Drop</button>
</div>

<div class="card">
<span class="metric">Dry <b id="dry">-</b></span>
<span class="metric">Maillard <b id="mai">-</b></span>
<span class="metric">Dev <b id="dev">-</b></span>
</div>

<div class="card">
Profile <input id="profileName">
<button onclick="saveProfile()">Save</button>
<select id="profiles"></select>
<button onclick="loadProfile()">Load</button>
<button onclick="compare()">Compare</button>
<button onclick="exportCSV()">CSV</button>
</div>

<div class="card">
<canvas id="c" width="1200" height="560"></canvas>
</div>

<script>
let running=false,startT=0,base=0;
let rows=[],events={},compareData=[];

const ctx=c.getContext("2d");
const timeEl=document.getElementById("time");

function now(){return running?base+Math.floor((Date.now()-startT)/1000):base}
function fmt(s){let m=Math.floor(s/60),sec=s%60;return m+":"+("0"+sec).slice(-2)}

function start(){if(running)return;running=true;startT=Date.now();loop()}
function stop(){base=now();running=false;draw()}
function resetTimer(){base=0;running=false;draw()}
function shift(d){base=Math.max(0,now()+d);if(running)startT=Date.now();draw()}

function loop(){timeEl.innerText=fmt(now());draw();if(running)requestAnimationFrame(loop)}

function save(){
let t=now();
rows.push({
t,
bt:parseFloat(bt.value),
pw:parseFloat(pw.value),
fan:parseFloat(fan.value),
id:Date.now()
});
rows.sort((a,b)=>a.t-b.t);
draw();
}

function mark(n){events[n]=now();draw()}

function btRows(src=rows){return src.filter(r=>!isNaN(r.bt)).sort((a,b)=>a.t-b.t)}

function interp(sec,src=rows){
let b=btRows(src);
if(b.length<2)return null;
for(let i=1;i<b.length;i++){
let p=b[i-1],c=b[i];
if(p.t<=sec&&sec<=c.t){
let r=(sec-p.t)/(c.t-p.t);
return p.bt+(c.bt-p.bt)r;
}}
return b[b.length-1].bt;
}

function ror(src=rows){
let out=[];
for(let t=30;t<=840;t+=5){
let a=interp(t,src),b=interp(t-30,src);
if(a!=null&&b!=null){
out.push({t,v:(a-b)/0.5});
}}
return smooth(out);
}

function smooth(r){
return r.map((p,i)=>{
let vals=[];
for(let j=i-2;j<=i+2;j++){
if(r[j])vals.push(r[j].v);
}
return {t:p.t,v:vals.reduce((a,b)=>a+b)/vals.length};
});
}

function phase(){
let s=events.Charge||0,g=events.GC,f=events.FC,d=events.Drop;
if(!g||!f||!d)return;
let tot=d-s;
dry.innerText=((g-s)/tot100).toFixed(0)+"%";
mai.innerText=((f-g)/tot100).toFixed(0)+"%";
dev.innerText=((d-f)/tot100).toFixed(0)+"%";
}

function drawLine(src,color){
let b=btRows(src);
ctx.beginPath();
b.forEach((p,i)=>{
let x=p.t1.4;
let y=500-(p.bt2);
if(i==0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});
ctx.strokeStyle=color;
ctx.stroke();
}

function drawPowerFan(src,color){
ctx.globalAlpha=0.5;

let pw=src.filter(r=>!isNaN(r.pw));
ctx.beginPath();
pw.forEach((p,i)=>{
let x=p.t1.4;
let y=550-(p.pw2);
if(i==0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});
ctx.strokeStyle="red";
ctx.stroke();

let fan=src.filter(r=>!isNaN(r.fan));
ctx.beginPath();
fan.forEach((p,i)=>{
let x=p.t1.4;
let y=550-(p.fan2);
if(i==0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});
ctx.strokeStyle="blue";
ctx.stroke();

ctx.globalAlpha=1;
}

function draw(){
phase();
ctx.clearRect(0,0,c.width,c.height);

drawLine(rows,"black");
drawPowerFan(rows);

compareData.forEach(d=>drawLine(d,"blue"));

let rr=ror(rows);
ctx.beginPath();
rr.forEach((p,i)=>{
let x=p.t1.4;
let y=500-(p.v5);
if(i==0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});
ctx.strokeStyle="orange";
ctx.stroke();
}

function saveProfile(){
let name=profileName.value||Date.now();
localStorage.setItem(name,JSON.stringify({rows,events}));
loadList();
}

function loadProfile(){
let p=JSON.parse(localStorage.getItem(profiles.value));
rows=p.rows;events=p.events;
draw();
}

function compare(){
let p=JSON.parse(localStorage.getItem(profiles.value));
compareData.push(p.rows);
draw();
}

function loadList(){
profiles.innerHTML="";
Object.keys(localStorage).forEach(k=>{
profiles.innerHTML+=<option>${k}</option>;
});
}

function exportCSV(){
let csv="Time,BT,Power,Fan\n";
rows.forEach(r=>{
csv+=fmt(r.t)+","+r.bt+","+r.pw+","+r.fan+"\n";
});
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv]));
a.download="artisan.csv";
a.click();
}

loadList();
draw();
</script>

</body>
</html>
