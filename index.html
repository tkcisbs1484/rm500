<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Artisan Pro v10 Gaussian RoR</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px;margin:4px;border-radius:8px;border:0;background:#222;color:#fff}
.red{background:#9b1c1c}
input{padding:8px;margin:4px;width:70px}
#time{font-size:42px;text-align:center}
canvas{width:100%;height:560px;border:2px solid #000;background:#fff;cursor:pointer}
.metric{display:inline-block;background:#eee;padding:6px;margin:4px;border-radius:6px}
</style>
</head>

<body>

<div class="card">
<div id="time">0:00</div>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="resetTimer()">Reset</button>
<button onclick="shift(-5)">-5s</button>
<button onclick="shift(5)">+5s</button>
</div>

<div class="card">
BT <button onclick="step('bt',-1)">-</button>
<input id="bt"><button onclick="step('bt',1)">+</button>

PW <button onclick="step('pw',-5)">-</button>
<input id="pw"><button onclick="step('pw',5)">+</button>

FAN <button onclick="step('fan',-5)">-</button>
<input id="fan"><button onclick="step('fan',5)">+</button>

<button onclick="save()">Save</button>
</div>

<div class="card">
<button onclick="mark('Charge')">Charge</button>
<button onclick="mark('Bottom')">Bottom</button>
<button onclick="mark('GC')">GC</button>
<button onclick="mark('FC')">FC</button>
<button onclick="mark('Drop')">Drop</button>
</div>

<div class="card">
<button onclick="editSelected()">編集</button>
<button class="red" onclick="deleteSelected()">削除</button>
<span id="sel">未選択</span>
</div>

<div class="card">
<span class="metric">Dry <b id="dry">-</b></span>
<span class="metric">Maillard <b id="mai">-</b></span>
<span class="metric">Dev <b id="dev">-</b></span>
</div>

<div class="card">
<canvas id="c" width="1200" height="580"></canvas>
</div>

<script>
let running=false,startT=0,base=0;
let rows=[],events={},selected=null;
let hitBT=[],hitEV=[];

const ctx=c.getContext("2d");

function now(){return running?base+Math.floor((Date.now()-startT)/1000):base}
function fmt(s){let m=Math.floor(s/60),sec=s%60;return m+":"+("0"+sec).slice(-2)}

function start(){if(running)return;running=true;startT=Date.now();loop()}
function stop(){base=now();running=false;draw()}
function resetTimer(){base=0;running=false;draw()}
function shift(d){base=Math.max(0,now()+d);if(running)startT=Date.now();draw()}
function loop(){time.innerText=fmt(now());draw();if(running)requestAnimationFrame(loop)}

function step(id,v){
let e=document.getElementById(id);
let val=parseFloat(e.value)||0;
e.value=val+v;
}

function save(){
rows.push({
t:now(),
bt:parseFloat(bt.value),
pw:parseFloat(pw.value),
fan:parseFloat(fan.value)
});
rows.sort((a,b)=>a.t-b.t);
draw();
}

function mark(n){events[n]=now();draw()}

function btRows(){return rows.filter(r=>!isNaN(r.bt)).sort((a,b)=>a.t-b.t)}

function interp(t){
let b=btRows();
if(b.length<2)return null;

for(let i=1;i<b.length;i++){
let p=b[i-1],c=b[i];
if(p.t<=t && t<=c.t){
let r=(t-p.t)/(c.t-p.t);
return p.bt+(c.bt-p.bt)*r;
}}
return b[b.length-1].bt;
}

/* ===== RoR ===== */
function ror(){
let out=[];
let b=btRows();
if(b.length<2)return out;

let lastT=b[b.length-1].t;
let endT=Math.min(840,lastT-5);

for(let t=30;t<=endT;t+=5){
let a=interp(t),bPrev=interp(t-30);
if(a!=null && bPrev!=null){
let v=(a-bPrev)/0.5;
if(v<0)v=0;
if(v>35)v=35;
out.push({t,v});
}}
return smoothGaussian(out);
}

/* ガウススムージング */
function smoothGaussian(r){
return r.map((p,i)=>{

let vals=[],weights=[];
let range = p.t<360?2:(p.t<420?4:8);

for(let j=-range;j<=range;j++){
if(r[i+j]){
let d=Math.abs(j);
let w=Math.exp(-(d*d)/(2*(range/2)*(range/2)));
vals.push(r[i+j].v*w);
weights.push(w);
}}

let avg=vals.reduce((a,b)=>a+b,0)/weights.reduce((a,b)=>a+b,0);
if(avg<0)avg=0;
if(avg>30)avg=30;

return {t:p.t,v:avg};
});
}

/* ===== 描画 ===== */
function draw(){

hitBT=[];hitEV=[];
ctx.clearRect(0,0,c.width,c.height);

let L=70,T=30,W=1000,H=450;
let x=t=>L+(t/840)*W;
let y=v=>T+H-(v/230)*H;
let yR=v=>T+H-(v/30)*H;

/* grid */
for(let i=0;i<=230;i+=10){
let yy=y(i);
ctx.strokeStyle="#eee";
ctx.beginPath();
ctx.moveTo(L,yy);ctx.lineTo(L+W,yy);ctx.stroke();
}

/* BT */
let b=btRows();
ctx.beginPath();
b.forEach((p,i)=>{
let xx=x(p.t),yy=y(p.bt);
if(i==0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
});
ctx.strokeStyle="#000";ctx.lineWidth=3;ctx.stroke();

/* BT点 */
b.forEach(p=>{
let xx=x(p.t),yy=y(p.bt);
ctx.beginPath();ctx.arc(xx,yy,5,0,Math.PI*2);ctx.fill();

if(selected===p){
ctx.strokeStyle="red";
ctx.lineWidth=3;
ctx.beginPath();
ctx.arc(xx,yy,10,0,Math.PI*2);
ctx.stroke();
}

hitBT.push({p,xx,yy});
});

/* RoR */
let rr=ror();
ctx.beginPath();
rr.forEach((p,i)=>{
let xx=x(p.t),yy=yR(p.v);
if(i==0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
});
ctx.strokeStyle="orange";ctx.globalAlpha=0.5;ctx.stroke();ctx.globalAlpha=1;

/* Eventドット */
Object.keys(events).forEach(n=>{
let t=events[n];
let temp=interp(t)||30;
let xx=x(t),yy=y(temp)-20;

ctx.fillStyle="#8a4b08";
ctx.beginPath();ctx.arc(xx,yy,7,0,Math.PI*2);ctx.fill();
ctx.fillText(n,xx+8,yy);

hitEV.push({name:n,xx,yy});
});

/* フェーズ帯 */
let s=events.Charge||0,g=events.GC,f=events.FC,d=events.Drop;
if(g&&f&&d){
let yb=T+H+40;
ctx.fillStyle="#f2d6a2";ctx.fillRect(x(s),yb,x(g)-x(s),15);
ctx.fillStyle="#d4b48c";ctx.fillRect(x(g),yb,x(f)-x(g),15);
ctx.fillStyle="#c8886f";ctx.fillRect(x(f),yb,x(d)-x(f),15);
}

}

/* クリック */
c.onclick=e=>{
let rect=c.getBoundingClientRect();
let mx=e.clientX-rect.left,my=e.clientY-rect.top;

hitBT.forEach(h=>{
if(Math.hypot(mx-h.xx,my-h.yy)<10){
selected=h.p;
sel.innerText="BT "+h.p.bt;
}
});
draw();
};

function editSelected(){
if(!selected)return;
let v=prompt("BT",selected.bt);
if(v!=null)selected.bt=parseFloat(v);
draw();
}

function deleteSelected(){
if(!selected)return;
rows=rows.filter(r=>r!==selected);
selected=null;
sel.innerText="未選択";
draw();
}

draw();
</script>

</body>
</html>
