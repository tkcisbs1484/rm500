<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Pro v16 RoR 30s Dot Only</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.wrap{max-width:1300px;margin:auto}
.row{display:flex;gap:10px;margin:8px}
.card{background:#fff;padding:10px;border-radius:10px;border:1px solid #ddd;flex:1}
button{padding:8px;border:0;border-radius:6px;background:#222;color:#fff;margin:2px}
.red{background:#9b1c1c}
.eventBtn{background:#8a4b08}
input,select{padding:6px;margin:2px}
#time{font-size:32px;text-align:center}
canvas{width:100%;height:520px;border:2px solid #000;background:#fff;cursor:pointer}
.inputRow{display:grid;grid-template-columns:50px auto auto auto;align-items:center;gap:6px;margin:6px 0}
.inputRow label{font-weight:bold;text-align:right}
.inputRow input{width:120px}
.small{font-size:12px;color:#555}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
Profile
<input id="profileName">
<button onclick="saveProfile()">Save</button>
<select id="profiles"></select>
<button onclick="loadProfile()">Load</button>
<button onclick="exportCSV()">CSV</button>
</div>

<div class="row">

<div class="card">
<div id="time">0:00</div>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="resetT()">Reset</button><br>
<button onclick="shift(-5)">-5</button>
<button onclick="shift(5)">+5</button>
</div>

<div class="card">
<div class="inputRow">
<label>BT</label>
<button onclick="step('bt',-1)">-1</button>
<input id="bt">
<button onclick="step('bt',1)">+1</button>
</div>

<div class="inputRow">
<label>PW</label>
<button onclick="step('pw',-5)">-5</button>
<input id="pw">
<button onclick="step('pw',5)">+5</button>
</div>

<div class="inputRow">
<label>FAN</label>
<button onclick="step('fan',-5)">-5</button>
<input id="fan">
<button onclick="step('fan',5)">+5</button>
</div>

<button onclick="save()">Save</button>
</div>

<div class="card">
<button class="eventBtn" onclick="mark('Charge')">Charge</button>
<button class="eventBtn" onclick="mark('Bottom')">Bottom</button>
<button class="eventBtn" onclick="mark('GC')">GC</button>
<button class="eventBtn" onclick="mark('FC')">FC</button>
<button class="eventBtn" onclick="mark('Drop')">Drop</button>
</div>

</div>

<div class="card">
<canvas id="c" width="1200" height="580"></canvas>
</div>

</div>

<script>
let rows=[],events={}
let running=false,startT=0,base=0

const canvas=document.getElementById("c")
const ctx=canvas.getContext("2d")
const timeEl=document.getElementById("time")
const btEl=document.getElementById("bt")
const pwEl=document.getElementById("pw")
const fanEl=document.getElementById("fan")

function now(){return running?base+Math.floor((Date.now()-startT)/1000):base}

function fmt(s){
s=Math.max(0,Math.floor(s))
let m=Math.floor(s/60)
let sec=s%60
return m+":"+("0"+sec).slice(-2)
}

function start(){
if(running)return
running=true
startT=Date.now()
loop()
}

function stop(){
base=now()
running=false
draw()
}

function resetT(){
base=0
running=false
timeEl.innerText="0:00"
draw()
}

function shift(d){
base=Math.max(0,now()+d)
if(running)startT=Date.now()
timeEl.innerText=fmt(base)
draw()
}

function loop(){
timeEl.innerText=fmt(now())
draw()
if(running)requestAnimationFrame(loop)
}

function step(id,v){
let el=document.getElementById(id)
let n=parseFloat(el.value)
if(isNaN(n))n=0
el.value=n+v
}

function save(){
rows.push({
t:now(),
bt:parseFloat(btEl.value),
pw:parseFloat(pwEl.value),
fan:parseFloat(fanEl.value)
})
rows.sort((a,b)=>a.t-b.t)
draw()
}

function mark(n){
events[n]=now()
draw()
}

function btRows(){
return rows.filter(r=>!isNaN(r.bt)).sort((a,b)=>a.t-b.t)
}

function interp(t){
let b=btRows()
if(b.length<2)return null
if(t<b[0].t)return null
if(t>=b[b.length-1].t)return b[b.length-1].bt

for(let i=1;i<b.length;i++){
let p=b[i-1],c=b[i]
if(p.t<=t&&t<=c.t){
let r=(t-p.t)/(c.t-p.t)
return p.bt+(c.bt-p.bt)*r
}}
return null
}

/* RoR：30秒ごとの黄色ドットのみ */
function ror(){
let out=[]
for(let t=30;t<=840;t+=30){
let a=interp(t)
let b=interp(t-30)

if(a!=null&&b!=null){
let v=(a-b)/0.5
if(v<0)v=0
if(v>35)v=35
out.push({t,v})
}}
return out
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height)

let L=60,T=25,W=1050,H=420
let x=t=>L+(t/840)*W
let y=v=>T+H-(v/230)*H
let yR=v=>T+H-(v/30)*H

ctx.font="12px Arial"

/* grid */
for(let temp=0;temp<=230;temp+=10){
let yy=y(temp)
ctx.strokeStyle="#eee"
ctx.beginPath()
ctx.moveTo(L,yy)
ctx.lineTo(L+W,yy)
ctx.stroke()

ctx.fillStyle="#000"
ctx.fillText(temp+"C",10,yy+4)
}

for(let sec=0;sec<=840;sec+=30){
let xx=x(sec)
ctx.strokeStyle=sec%60===0?"#ddd":"#f3f3f3"
ctx.beginPath()
ctx.moveTo(xx,T)
ctx.lineTo(xx,T+H)
ctx.stroke()

if(sec%60===0){
ctx.fillStyle="#000"
ctx.fillText((sec/60)+"m",xx-8,T+H+22)
}
}

/* BT line */
let b=btRows()
if(b.length){
ctx.beginPath()
b.forEach((p,i)=>{
let xx=x(p.t),yy=y(p.bt)
if(i===0)ctx.moveTo(xx,yy)
else ctx.lineTo(xx,yy)
})
ctx.strokeStyle="#000"
ctx.lineWidth=3
ctx.stroke()
}

/* BT dots */
b.forEach(p=>{
let xx=x(p.t),yy=y(p.bt)
ctx.fillStyle="#000"
ctx.beginPath()
ctx.arc(xx,yy,5,0,Math.PI*2)
ctx.fill()
ctx.fillText(Math.round(p.bt)+"C",xx+7,yy-10)
})

/* RoR DOT ONLY：30秒ごと */
let rr=ror()
ctx.fillStyle="#f2b600"
ctx.font="12px Arial"

rr.forEach(p=>{
let xx=x(p.t)
let yy=yR(p.v)

ctx.beginPath()
ctx.arc(xx,yy,5,0,Math.PI*2)
ctx.fill()

ctx.fillText(p.v.toFixed(1),xx+6,yy-6)
})

/* Power/Fan */
let pfTop=T+H*(2/3)
let pfH=H/3
let yPF=v=>pfTop+pfH-(Math.max(0,Math.min(100,v))/100)*pfH

ctx.strokeStyle="rgba(0,0,0,.25)"
ctx.setLineDash([4,4])
ctx.beginPath()
ctx.moveTo(L,pfTop)
ctx.lineTo(L+W,pfTop)
ctx.stroke()
ctx.setLineDash([])

drawStep(rows.filter(r=>!isNaN(r.pw)).sort((a,b)=>a.t-b.t),"pw",x,yPF,"red")
drawStep(rows.filter(r=>!isNaN(r.fan)).sort((a,b)=>a.t-b.t),"fan",x,yPF,"blue")

/* event dots */
Object.keys(events).forEach(n=>{
let t=events[n]
let xx=x(t)
let yy=y(interp(t)||30)-18

ctx.fillStyle="#8a4b08"
ctx.beginPath()
ctx.arc(xx,yy,6,0,Math.PI*2)
ctx.fill()

ctx.fillText(n,xx+6,yy)
})
}

function drawStep(points,key,x,y,color){
if(!points.length)return
ctx.save()
ctx.globalAlpha=0.5
ctx.strokeStyle=color
ctx.lineWidth=3
ctx.beginPath()

let prev=points[0]
ctx.moveTo(x(prev.t),y(prev[key]))

for(let i=1;i<points.length;i++){
let cur=points[i]
ctx.lineTo(x(cur.t),y(prev[key]))
ctx.lineTo(x(cur.t),y(cur[key]))
prev=cur
}

ctx.stroke()
ctx.restore()
}

function saveProfile(){
let name=profileName.value||"profile_"+Date.now()
localStorage.setItem(name,JSON.stringify({rows,events}))
loadList()
}

function loadProfile(){
let p=JSON.parse(localStorage.getItem(profiles.value))
rows=p.rows||[]
events=p.events||{}
draw()
}

function loadList(){
profiles.innerHTML=""
Object.keys(localStorage).forEach(k=>{
profiles.innerHTML+=`<option>${k}</option>`
})
}

function exportCSV(){
let csv="t,bt,pw,fan\n"
rows.forEach(r=>{
csv+=r.t+","+r.bt+","+r.pw+","+r.fan+"\n"
})

let a=document.createElement("a")
a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}))
a.download="rm500.csv"
a.click()
}

loadList()
draw()
</script>

</body>
</html>
