<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Pro v13 Event Edit</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.wrap{max-width:1300px;margin:auto}
.row{display:flex;gap:10px;margin:8px}
.card{background:#fff;padding:10px;border-radius:10px;border:1px solid #ddd;flex:1}
button{padding:8px;border:0;border-radius:6px;background:#222;color:#fff;margin:2px}
.red{background:#9b1c1c}
.eventBtn{background:#8a4b08}
input,select{padding:6px;margin:2px}
#time{font-size:32px;text-align:center}
canvas{width:100%;height:520px;border:2px solid #000;background:#fff;cursor:pointer}
.inputRow{display:grid;grid-template-columns:50px auto auto auto;align-items:center;gap:6px;margin:6px 0}
.inputRow label{font-weight:bold;text-align:right}
.inputRow input{width:120px}
.small{font-size:12px;color:#555}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
Profile
<input id="profileName">
<button onclick="saveProfile()">Save</button>
<select id="profiles"></select>
<button onclick="loadProfile()">Load</button>
<button onclick="compare()">Compare</button>
<button onclick="clearCompare()">Clear</button>
<button onclick="exportCSV()">CSV</button>
</div>

<div class="row">

<div class="card">
<div id="time">0:00</div>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="resetT()">Reset</button><br>
<button onclick="shift(-5)">-5</button>
<button onclick="shift(5)">+5</button>
</div>

<div class="card">
<div class="inputRow">
  <label for="bt">BT</label>
  <button onclick="stepInput('bt',-1)">-1</button>
  <input id="bt">
  <button onclick="stepInput('bt',1)">+1</button>
</div>
<div class="inputRow">
  <label for="pw">PW</label>
  <button onclick="stepInput('pw',-5)">-5</button>
  <input id="pw">
  <button onclick="stepInput('pw',5)">+5</button>
</div>
<div class="inputRow">
  <label for="fan">FAN</label>
  <button onclick="stepInput('fan',-5)">-5</button>
  <input id="fan">
  <button onclick="stepInput('fan',5)">+5</button>
</div>
<button onclick="save()">Save</button>
</div>

<div class="card">
<button class="eventBtn" onclick="mark('Charge')">Charge</button>
<button class="eventBtn" onclick="mark('Bottom')">Bottom</button>
<button class="eventBtn" onclick="mark('GC')">GC</button>
<button class="eventBtn" onclick="mark('FC')">FC</button>
<button class="eventBtn" onclick="mark('Drop')">Drop</button><br>
<button onclick="editSelectedEvent()">選択イベント編集</button>
<button class="red" onclick="deleteSelectedEvent()">選択イベント削除</button>
<div class="small" id="eventSel">イベント選択：なし</div>
</div>

</div>

<div class="card">
<button onclick="editSel()">選択点を編集</button>
<button class="red" onclick="delSel()">選択点を削除</button>
<span id="sel">未選択</span>
</div>

<div class="card">
<canvas id="c" width="1200" height="580"></canvas>
</div>

</div>

<script>
let rows=[],events={},compareData=[];
let running=false,startT=0,base=0;
let selected=null;
let selectedEvent=null;
let eventTargets=[];

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const timeEl=document.getElementById("time");
const btEl=document.getElementById("bt");
const pwEl=document.getElementById("pw");
const fanEl=document.getElementById("fan");
const selEl=document.getElementById("sel");
const eventSelEl=document.getElementById("eventSel");

function now(){return running?base+Math.floor((Date.now()-startT)/1000):base}

function fmt(s){
  s=Math.max(0,Math.floor(s));
  let m=Math.floor(s/60);
  let sec=s%60;
  return m+":"+("0"+sec).slice(-2);
}

function start(){
  if(running)return;
  running=true;
  startT=Date.now();
  loop();
}

function stop(){
  base=now();
  running=false;
  timeEl.innerText=fmt(base);
  draw();
}

function resetT(){
  base=0;
  running=false;
  timeEl.innerText="0:00";
  draw();
}

function shift(d){
  base=Math.max(0,now()+d);
  if(running)startT=Date.now();
  timeEl.innerText=fmt(base);
  draw();
}

function loop(){
  timeEl.innerText=fmt(now());
  draw();
  if(running)requestAnimationFrame(loop);
}

function stepInput(id,step){
  let el=document.getElementById(id);
  let v=parseFloat(el.value);
  if(isNaN(v))v=0;
  el.value=v+step;
}

function save(){
  rows.push({
    t:now(),
    bt:parseFloat(btEl.value),
    pw:parseFloat(pwEl.value),
    fan:parseFloat(fanEl.value)
  });
  rows.sort((a,b)=>a.t-b.t);
  draw();
}

function mark(n){
  events[n]=now();
  selectedEvent=n;
  eventSelEl.innerText="イベント選択："+n+" / "+fmt(events[n]);
  draw();
}

function btRows(src=rows){
  return src.filter(r=>!isNaN(r.bt)).sort((a,b)=>a.t-b.t);
}

function interp(t,src=rows){
  let b=btRows(src);
  if(b.length<2)return null;
  if(t<b[0].t)return null;
  if(t>=b[b.length-1].t)return b[b.length-1].bt;

  for(let i=1;i<b.length;i++){
    let p=b[i-1],c=b[i];
    if(p.t<=t&&t<=c.t){
      let r=(t-p.t)/(c.t-p.t);
      return p.bt+(c.bt-p.bt)*r;
    }
  }
  return null;
}

function ror(src=rows){
  let out=[],b=btRows(src);
  if(b.length<2)return out;

  let last=b[b.length-1].t;
  let end=Math.min(840,last-5);

  for(let t=30;t<=end;t+=5){
    let a=interp(t,src);
    let bPrev=interp(t-30,src);
    if(a!=null&&bPrev!=null){
      let v=(a-bPrev)/0.5;
      if(v<0)v=0;
      if(v>35)v=35;
      out.push({t,v});
    }
  }
  return smooth(out);
}

function smooth(r){
  return r.map((p,i)=>{
    let range;
    if(p.t<360)range=2;
    else if(p.t<420)range=4;
    else if(p.t<540)range=10;
    else range=14;

    let vals=[],w=[];

    for(let j=-range;j<=range;j++){
      if(r[i+j]){
        let d=Math.abs(j);
        let sigma=Math.max(1,range/2);
        let weight=Math.exp(-(d*d)/(2*sigma*sigma));
        vals.push(r[i+j].v*weight);
        w.push(weight);
      }
    }

    let avg=vals.reduce((a,b)=>a+b,0)/w.reduce((a,b)=>a+b,0);
    return {t:p.t,v:Math.max(0,Math.min(30,avg))};
  });
}

function draw(){
  eventTargets=[];
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let L=60,T=25,W=1050,H=420;
  let x=t=>L+(t/840)*W;
  let y=v=>T+H-(v/230)*H;
  let yR=v=>T+H-(v/30)*H;

  ctx.font="12px Arial";

  for(let temp=0;temp<=230;temp+=10){
    let yy=y(temp);
    ctx.strokeStyle="#eee";
    ctx.beginPath();
    ctx.moveTo(L,yy);
    ctx.lineTo(L+W,yy);
    ctx.stroke();
    ctx.fillStyle="#000";
    ctx.fillText(temp+"C",10,yy+4);
  }

  for(let sec=0;sec<=840;sec+=30){
    let xx=x(sec);
    ctx.strokeStyle=sec%60===0?"#ddd":"#f3f3f3";
    ctx.beginPath();
    ctx.moveTo(xx,T);
    ctx.lineTo(xx,T+H);
    ctx.stroke();

    if(sec%60===0){
      ctx.fillStyle="#000";
      ctx.fillText((sec/60)+"m",xx-8,T+H+22);
    }
  }

  compareData.forEach(src=>{
    let cb=btRows(src);
    if(!cb.length)return;

    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.strokeStyle="blue";
    ctx.lineWidth=3;
    ctx.beginPath();

    cb.forEach((p,i)=>{
      let xx=x(p.t),yy=y(p.bt);
      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
    ctx.restore();
  });

  let b=btRows();
  if(b.length){
    ctx.beginPath();
    b.forEach((p,i)=>{
      let xx=x(p.t),yy=y(p.bt);
      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });
    ctx.strokeStyle="#000";
    ctx.lineWidth=3;
    ctx.stroke();
  }

  b.forEach(p=>{
    let xx=x(p.t),yy=y(p.bt);
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.arc(xx,yy,5,0,Math.PI*2);
    ctx.fill();

    ctx.fillText(Math.round(p.bt)+"C",xx+7,yy-10);

    if(selected===p){
      ctx.strokeStyle="red";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(xx,yy,10,0,Math.PI*2);
      ctx.stroke();
    }
  });

  let rr=ror();
  if(rr.length){
    ctx.beginPath();
    rr.forEach((p,i)=>{
      let xx=x(p.t),yy=yR(p.v);
      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });
    ctx.strokeStyle="orange";
    ctx.globalAlpha=0.5;
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  let pfTop=T+H*(2/3);
  let pfH=H/3;
  let yPF=v=>pfTop+pfH-(Math.max(0,Math.min(100,v))/100)*pfH;

  ctx.strokeStyle="rgba(0,0,0,.25)";
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(L,pfTop);
  ctx.lineTo(L+W,pfTop);
  ctx.stroke();
  ctx.setLineDash([]);

  let pwData=rows.filter(r=>!isNaN(r.pw)).sort((a,b)=>a.t-b.t);
  if(pwData.length){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="red";
    ctx.lineWidth=3;
    drawStep(pwData,"pw",x,yPF);
    ctx.restore();
  }

  let fanData=rows.filter(r=>!isNaN(r.fan)).sort((a,b)=>a.t-b.t);
  if(fanData.length){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="blue";
    ctx.lineWidth=3;
    drawStep(fanData,"fan",x,yPF);
    ctx.restore();
  }

  Object.keys(events).forEach(n=>{
    let t=events[n];
    let xx=x(t),yy=y(interp(t)||30)-18;

    ctx.fillStyle="#8a4b08";
    ctx.beginPath();
    ctx.arc(xx,yy,6,0,Math.PI*2);
    ctx.fill();

    if(selectedEvent===n){
      ctx.strokeStyle="red";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(xx,yy,11,0,Math.PI*2);
      ctx.stroke();
    }

    ctx.fillStyle="#8a4b08";
    ctx.fillText(n+" "+fmt(t),xx+8,yy);

    eventTargets.push({
      name:n,
      x:xx,
      y:yy,
      radius:18
    });
  });

  let s=events.Charge||0,g=events.GC,f=events.FC,d=events.Drop;

  if(g&&f&&d){
    let yb=T+H+30;
    let tot=d-s;
    let dry=((g-s)/tot*100)|0;
    let mai=((f-g)/tot*100)|0;
    let dev=((d-f)/tot*100)|0;

    ctx.fillStyle="#f2d6a2";
    ctx.fillRect(x(s),yb,x(g)-x(s),14);

    ctx.fillStyle="#d4b48c";
    ctx.fillRect(x(g),yb,x(f)-x(g),14);

    ctx.fillStyle="#c8886f";
    ctx.fillRect(x(f),yb,x(d)-x(f),14);

    ctx.fillStyle="#000";
    ctx.fillText(dry+"%",x(s)+4,yb+10);
    ctx.fillText(mai+"%",x(g)+4,yb+10);
    ctx.fillText(dev+"%",x(f)+4,yb+10);
  }
}

function drawStep(points,key,x,y){
  ctx.beginPath();
  let prev=points[0];
  ctx.moveTo(x(prev.t),y(prev[key]));

  for(let i=1;i<points.length;i++){
    let cur=points[i];
    ctx.lineTo(x(cur.t),y(prev[key]));
    ctx.lineTo(x(cur.t),y(cur[key]));
    prev=cur;
  }
  ctx.stroke();
}

canvas.onclick=e=>{
  let rect=canvas.getBoundingClientRect();
  let mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  let my=(e.clientY-rect.top)*(canvas.height/rect.height);

  let eventHit=false;

  eventTargets.forEach(ev=>{
    if(Math.hypot(mx-ev.x,my-ev.y)<ev.radius){
      selectedEvent=ev.name;
      eventSelEl.innerText="イベント選択："+ev.name+" / "+fmt(events[ev.name]);
      eventHit=true;
    }
  });

  if(eventHit){
    draw();
    return;
  }

  selected=null;

  rows.forEach(p=>{
    let xx=60+(p.t/840)*1050;

    let candidates=[];

    if(!isNaN(p.bt)){
      candidates.push({type:"BT",x:xx,y:25+420-(p.bt/230)*420});
    }

    let pfTop=25+420*(2/3);
    let pfH=420/3;

    if(!isNaN(p.pw)){
      candidates.push({type:"PW",x:xx,y:pfTop+pfH-(Math.max(0,Math.min(100,p.pw))/100)*pfH});
    }

    if(!isNaN(p.fan)){
      candidates.push({type:"FAN",x:xx,y:pfTop+pfH-(Math.max(0,Math.min(100,p.fan))/100)*pfH});
    }

    candidates.forEach(ca=>{
      if(Math.hypot(mx-ca.x,my-ca.y)<12){
        selected=p;
        selEl.innerText="選択中 "+ca.type+" / BT:"+p.bt+" PW:"+p.pw+" FAN:"+p.fan+" / "+fmt(p.t);
      }
    });
  });

  draw();
}

function parseTime(v){
  v=String(v).trim();
  if(v.includes(":")){
    let p=v.split(":");
    if(p.length!==2)return null;
    let m=parseInt(p[0],10);
    let s=parseInt(p[1],10);
    if(isNaN(m)||isNaN(s)||s<0||s>59)return null;
    return m*60+s;
  }
  let n=parseFloat(v);
  if(isNaN(n))return null;
  return Math.max(0,Math.floor(n));
}

function editSel(){
  if(!selected)return;

  let newTime=prompt("Time mm:ss",fmt(selected.t));
  if(newTime===null)return;

  let parsed=parseTime(newTime);
  if(parsed===null){
    alert("Invalid time");
    return;
  }

  let newBT=prompt("BT",isNaN(selected.bt)?"":selected.bt);
  if(newBT===null)return;

  let newPW=prompt("PW",isNaN(selected.pw)?"":selected.pw);
  if(newPW===null)return;

  let newFAN=prompt("FAN",isNaN(selected.fan)?"":selected.fan);
  if(newFAN===null)return;

  selected.t=parsed;
  selected.bt=newBT===""?NaN:parseFloat(newBT);
  selected.pw=newPW===""?NaN:parseFloat(newPW);
  selected.fan=newFAN===""?NaN:parseFloat(newFAN);

  rows.sort((a,b)=>a.t-b.t);
  selEl.innerText="選択中 / BT:"+selected.bt+" PW:"+selected.pw+" FAN:"+selected.fan+" / "+fmt(selected.t);
  draw();
}

function delSel(){
  if(!selected)return;
  rows=rows.filter(r=>r!==selected);
  selected=null;
  selEl.innerText="未選択";
  draw();
}

function editSelectedEvent(){
  if(!selectedEvent){
    alert("先にグラフ上のイベントドットを選択してください");
    return;
  }

  let newTime=prompt(selectedEvent+" Time mm:ss",fmt(events[selectedEvent]));
  if(newTime===null)return;

  let parsed=parseTime(newTime);
  if(parsed===null){
    alert("Invalid time");
    return;
  }

  events[selectedEvent]=parsed;
  eventSelEl.innerText="イベント選択："+selectedEvent+" / "+fmt(parsed);
  draw();
}

function deleteSelectedEvent(){
  if(!selectedEvent){
    alert("先にグラフ上のイベントドットを選択してください");
    return;
  }

  delete events[selectedEvent];
  selectedEvent=null;
  eventSelEl.innerText="イベント選択：なし";
  draw();
}

function saveProfile(){
  let name=profileName.value||"profile_"+Date.now();
  localStorage.setItem(name,JSON.stringify({rows,events}));
  loadList();
}

function loadProfile(){
  let p=JSON.parse(localStorage.getItem(profiles.value));
  rows=p.rows||[];
  events=p.events||{};
  selected=null;
  selectedEvent=null;
  selEl.innerText="未選択";
  eventSelEl.innerText="イベント選択：なし";
  draw();
}

function compare(){
  let p=JSON.parse(localStorage.getItem(profiles.value));
  compareData.push(p.rows||[]);
  draw();
}

function clearCompare(){
  compareData=[];
  draw();
}

function loadList(){
  profiles.innerHTML="";
  Object.keys(localStorage).forEach(k=>{
    profiles.innerHTML+=`<option>${k}</option>`;
  });
}

function exportCSV(){
  let csv="t,bt,pw,fan\n";
  rows.forEach(r=>{
    csv+=r.t+","+r.bt+","+r.pw+","+r.fan+"\n";
  });

  csv+="\nEvents\n";
  Object.keys(events).forEach(k=>{
    csv+=k+","+events[k]+","+fmt(events[k])+"\n";
  });

  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="rm500.csv";
  a.click();
}

loadList();
draw();
</script>

</body>
</html>
