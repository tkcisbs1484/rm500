<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Artisan RoR v2</title>
<style>
body{margin:0;background:#f5f5f5;font-family:Arial;color:#222}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px 14px;margin:4px;border:0;border-radius:8px;background:#222;color:#fff;font-size:15px}
button.event{background:#8a4b08}
input{padding:8px;margin:4px;width:90px;font-size:15px}
#time{font-size:44px;text-align:center;font-weight:bold}
canvas{width:100%;height:430px;background:white;border:2px solid #000;border-radius:10px}
</style>
</head>
<body>

<div class="card">
  <div id="time">0:00</div>
  <button onclick="startTimer()">Start</button>
  <button onclick="stopTimer()">Stop</button>
  <button onclick="resetTimer()">Reset</button>
  <button onclick="shiftTime(-10)">-10s</button>
  <button onclick="shiftTime(10)">+10s</button>
</div>

<div class="card">
  BT <input id="btInput" type="number" step="1">
  Power <input id="powerInput" type="number" step="5">
  Fan <input id="fanInput" type="number" step="5">
  <button onclick="savePoint()">Save</button>
</div>

<div class="card">
  <button class="event" onclick="markEvent('Charge')">Charge</button>
  <button class="event" onclick="markEvent('Bottom')">Bottom</button>
  <button class="event" onclick="markEvent('GC')">GC</button>
  <button class="event" onclick="markEvent('FC')">1st Crack</button>
  <button class="event" onclick="markEvent('Drop')">Drop</button>
</div>

<div class="card">
  <canvas id="graph" width="1100" height="520"></canvas>
</div>

<script>
let running=false;
let startMs=0;
let baseSec=0;
let data=[];
let events={};

const DELTA_SPAN=30;
const SMOOTH_WINDOW=3;

const timeEl=document.getElementById("time");
const canvas=document.getElementById("graph");
const ctx=canvas.getContext("2d");

function nowSec(){
  return running ? baseSec + Math.floor((Date.now()-startMs)/1000) : baseSec;
}

function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  let m=Math.floor(sec/60);
  let s=sec%60;
  return m+":"+String(s).padStart(2,"0");
}

function startTimer(){
  if(running)return;
  running=true;
  startMs=Date.now();
  loop();
}

function stopTimer(){
  baseSec=nowSec();
  running=false;
  timeEl.innerText=fmt(baseSec);
  draw();
}

function resetTimer(){
  baseSec=0;
  running=false;
  timeEl.innerText="0:00";
  draw();
}

function shiftTime(delta){
  baseSec=Math.max(0,nowSec()+delta);
  if(running)startMs=Date.now();
  timeEl.innerText=fmt(baseSec);
  draw();
}

function loop(){
  timeEl.innerText=fmt(nowSec());
  draw();
  if(running)requestAnimationFrame(loop);
}

function savePoint(){
  let t=nowSec();
  let btVal=parseFloat(document.getElementById("btInput").value);
  let powerVal=parseFloat(document.getElementById("powerInput").value);
  let fanVal=parseFloat(document.getElementById("fanInput").value);

  if(isNaN(btVal)&&isNaN(powerVal)&&isNaN(fanVal))return;

  data.push({
    t:t,
    bt:btVal,
    power:powerVal,
    fan:fanVal
  });

  data.sort((a,b)=>a.t-b.t);
  draw();
}

function markEvent(name){
  events[name]=nowSec();
  draw();
}

function btData(){
  return data.filter(d=>!isNaN(d.bt)).sort((a,b)=>a.t-b.t);
}

function getInterpolatedBT(sec){
  let b=btData();
  if(b.length===0)return null;
  if(sec<b[0].t)return null;

  if(sec>=b[b.length-1].t){
    return b[b.length-1].bt;
  }

  for(let i=1;i<b.length;i++){
    let prev=b[i-1];
    let cur=b[i];

    if(prev.t<=sec && sec<=cur.t){
      let span=cur.t-prev.t;
      if(span<=0)return cur.bt;
      let ratio=(sec-prev.t)/span;
      return prev.bt+(cur.bt-prev.bt)*ratio;
    }
  }

  return null;
}

function calcArtisanRoR(){
  let b=btData();
  let out=[];
  if(b.length<2)return out;

  let start=Math.ceil((b[0].t+DELTA_SPAN)/5)*5;
  let end=Math.floor(b[b.length-1].t/5)*5;

  for(let sec=start;sec<=end;sec+=5){
    let nowBT=getInterpolatedBT(sec);
    let prevBT=getInterpolatedBT(sec-DELTA_SPAN);

    if(nowBT===null||prevBT===null)continue;

    let ror=(nowBT-prevBT)/(DELTA_SPAN/60);
    out.push({t:sec,ror:ror});
  }

  return out;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let L=70,R=60,T=25,B=55;
  let W=canvas.width-L-R;
  let H=canvas.height-T-B;

  let maxTime=Math.max(14*60,nowSec(),...data.map(d=>d.t||0));
  let maxTemp=230;
  let maxRor=30;

  let x=sec=>L+(sec/maxTime)*W;
  let yTemp=temp=>T+H-(temp/maxTemp)*H;
  let yRor=ror=>T+H-(Math.max(0,Math.min(maxRor,ror))/maxRor)*H;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.font="13px Arial";

  for(let temp=0;temp<=230;temp+=10){
    let y=yTemp(temp);
    ctx.strokeStyle="#eee";
    ctx.beginPath();
    ctx.moveTo(L,y);
    ctx.lineTo(L+W,y);
    ctx.stroke();
  }

  for(let sec=0;sec<=maxTime;sec+=60){
    let xx=x(sec);
    ctx.strokeStyle="#ddd";
    ctx.beginPath();
    ctx.moveTo(xx,T);
    ctx.lineTo(xx,T+H);
    ctx.stroke();
  }

  let b=btData();

  if(b.length){
    ctx.strokeStyle="#000";
    ctx.lineWidth=3;
    ctx.beginPath();

    b.forEach((d,i)=>{
      let xx=x(d.t),yy=yTemp(d.bt);
      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
  }

  let rr=calcArtisanRoR();

  if(rr.length){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="orange";
    ctx.lineWidth=3;
    ctx.beginPath();

    rr.forEach((d,i)=>{
      let xx=x(d.t),yy=yRor(d.ror);
      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
    ctx.restore();
  }
}

draw();
</script>

</body>
</html>
