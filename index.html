<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Logger v29</title>

<style>
body{margin:0;background:#f5f5f5;font-family:Arial}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px;margin:3px;border-radius:6px;border:0;background:#222;color:#fff}
input{padding:8px;margin:3px;width:80px}
#time{font-size:42px;text-align:center}
canvas{width:100%;height:480px;border:2px solid #000;border-radius:10px}
</style>
</head>

<body>

<div class="card">
<div id="time">00:00</div>
<button onclick="start()">Start</button>
<button onclick="pause()">Pause</button>
<button onclick="reset()">Reset</button>
<button onclick="shift(-10)">-10s</button>
<button onclick="shift(10)">+10s</button>
</div>

<div class="card">
BT <input id="bt">
Power <input id="pw">
Fan <input id="fan">
<button onclick="save()">Save</button>
</div>

<canvas id="c" width="1000" height="520"></canvas>

<script>
let rows=[],run=false,startT=0,base=0;

const timeEl = document.getElementById("time");

function now(){return run?base+Math.floor((Date.now()-startT)/1000):base}
function fmt(s){let m=Math.floor(s/60),sec=s%60;return m+":"+("0"+sec).slice(-2)}

function start(){if(run)return;run=true;startT=Date.now();loop()}
function pause(){base=now();run=false}
function reset(){base=0;run=false;rows=[];draw()}

function shift(d){base=Math.max(0,now()+d);startT=Date.now()}

function loop(){
timeEl.innerText=fmt(now());
draw();
if(run)requestAnimationFrame(loop);
}

function save(){
let t=now();
let bt=parseFloat(document.getElementById("bt").value);
if(isNaN(bt))return;
rows.push({t,bt});
rows.sort((a,b)=>a.t-b.t);
document.getElementById("bt").value="";
}

function draw(){
let c=document.getElementById("c");
let ctx=c.getContext("2d");

ctx.clearRect(0,0,c.width,c.height);

let L=80,T=20,W=840,H=420;
let maxT=14*60;
let maxTemp=230;

let x=t=>L+(t/maxT)*W;
let y=v=>T+H-(v/maxTemp)*H;

ctx.strokeStyle="#ddd";
for(let temp=0;temp<=230;temp+=10){
let yy=y(temp);
ctx.beginPath();
ctx.moveTo(L,yy);
ctx.lineTo(L+W,yy);
ctx.stroke();
ctx.fillText(temp+"C",10,yy);
}

for(let m=0;m<=14;m++){
let xx=x(m*60);
ctx.beginPath();
ctx.moveTo(xx,T);
ctx.lineTo(xx,T+H);
ctx.stroke();
ctx.fillText(m+"m",xx-10,T+H+20);
}

ctx.strokeStyle="#000";
ctx.beginPath();
ctx.moveTo(L,T);
ctx.lineTo(L,T+H);
ctx.lineTo(L+W,T+H);
ctx.stroke();

if(rows.length>0){
ctx.strokeStyle="black";
ctx.beginPath();
rows.forEach((r,i)=>{
let xx=x(r.t),yy=y(r.bt);
if(i==0)ctx.moveTo(xx,yy);
else ctx.lineTo(xx,yy);
});
ctx.stroke();

rows.forEach(r=>{
let xx=x(r.t),yy=y(r.bt);
ctx.fillText(r.bt,xx+5,yy-5);
});
}

ctx.fillText("RM500 v29 OK",L+10,T+20);
}

draw();
</script>

</body>
</html>
