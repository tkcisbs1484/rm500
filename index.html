<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Logger Base v3</title>
<style>
body{margin:0;background:#f5f5f5;font-family:Arial;color:#222}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px;border:1px solid #ddd}
button{padding:10px 14px;margin:4px;border:0;border-radius:8px;background:#222;color:#fff;font-size:15px}
input{padding:8px;margin:4px;width:90px;font-size:15px}
#time{font-size:44px;text-align:center;font-weight:bold}
canvas{width:100%;height:430px;background:white;border:2px solid #000;border-radius:10px}
</style>
</head>
<body>

<div class="card">
  <div id="time">0:00</div>
  <button onclick="startTimer()">Timer Start</button>
  <button onclick="stopTimer()">Stop</button>
  <button onclick="clearTimer()">Clear Timer</button>
  <button onclick="shiftTime(-10)">-10s</button>
  <button onclick="shiftTime(10)">+10s</button>
</div>

<div class="card">
  BT Temp <input id="bt" type="number" step="1">
  Power <input id="power" type="number" step="5">
  Fan <input id="fan" type="number" step="5">
  <button onclick="savePoint()">Save</button>
</div>

<div class="card">
  <canvas id="graph" width="1100" height="520"></canvas>
</div>

<script>
let running=false;
let startMs=0;
let baseSec=0;
let data=[];

const timeEl=document.getElementById("time");
const canvas=document.getElementById("graph");
const ctx=canvas.getContext("2d");

function nowSec(){
  return running ? baseSec + Math.floor((Date.now()-startMs)/1000) : baseSec;
}

function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  let m=Math.floor(sec/60);
  let s=sec%60;
  return m+":"+String(s).padStart(2,"0");
}

function startTimer(){
  if(running)return;
  running=true;
  startMs=Date.now();
  loop();
}

function stopTimer(){
  baseSec=nowSec();
  running=false;
  timeEl.innerText=fmt(baseSec);
  draw();
}

function clearTimer(){
  baseSec=0;
  running=false;
  timeEl.innerText="0:00";
  draw();
}

function shiftTime(delta){
  baseSec=Math.max(0,nowSec()+delta);
  if(running)startMs=Date.now();
  timeEl.innerText=fmt(baseSec);
  draw();
}

function loop(){
  timeEl.innerText=fmt(nowSec());
  draw();
  if(running)requestAnimationFrame(loop);
}

function savePoint(){
  let t=nowSec();
  let bt=parseFloat(document.getElementById("bt").value);
  let power=parseFloat(document.getElementById("power").value);
  let fan=parseFloat(document.getElementById("fan").value);

  if(isNaN(bt)&&isNaN(power)&&isNaN(fan))return;

  data.push({t,bt,power,fan});
  data.sort((a,b)=>a.t-b.t);

  // 入力値は消さず、そのまま残す
  draw();
}

function btData(){
  return data.filter(d=>!isNaN(d.bt)).sort((a,b)=>a.t-b.t);
}

function rawRor(){
  let b=btData();
  let out=[];
  for(let i=1;i<b.length;i++){
    let dt=(b[i].t-b[i-1].t)/60;
    if(dt<=0)continue;
    let r=(b[i].bt-b[i-1].bt)/dt;
    out.push({t:b[i].t,ror:r});
  }
  return out;
}

function smoothRor(){
  let r=rawRor();
  let out=[];
  for(let i=0;i<r.length;i++){
    let vals=[];
    for(let j=Math.max(0,i-1);j<=Math.min(r.length-1,i+1);j++){
      vals.push(r[j].ror);
    }
    out.push({
      t:r[i].t,
      ror:vals.reduce((a,b)=>a+b,0)/vals.length
    });
  }
  return out;
}

function stepLine(points,valueKey,x,y){
  if(points.length===0)return;

  ctx.beginPath();
  let prev=points[0];
  ctx.moveTo(x(prev.t),y(prev[valueKey]));

  for(let i=1;i<points.length;i++){
    let cur=points[i];
    ctx.lineTo(x(cur.t),y(prev[valueKey]));
    ctx.lineTo(x(cur.t),y(cur[valueKey]));
    prev=cur;
  }

  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let L=70;
  let R=55;
  let T=25;
  let B=55;

  let W=canvas.width-L-R;
  let H=canvas.height-T-B;

  let maxTime=14*60;
  let maxTemp=230;
  let maxRor=30;

  let x=sec=>L+(sec/maxTime)*W;
  let yTemp=temp=>T+H-(temp/maxTemp)*H;
  let yRor=ror=>T+H-(Math.max(0,Math.min(maxRor,ror))/maxRor)*H;

  // Power/Fan lower 1/3 only
  let pfTop=T+H*(2/3);
  let pfH=H/3;
  let yPF=v=>pfTop+pfH-(Math.max(0,Math.min(100,v))/100)*pfH;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.font="13px Arial";
  ctx.textBaseline="middle";

  // temp grid 0-230C, 5C steps
  for(let temp=0;temp<=230;temp+=5){
    let yy=yTemp(temp);

    ctx.strokeStyle=temp%10===0 ? "#ddd" : "#eee";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(L,yy);
    ctx.lineTo(L+W,yy);
    ctx.stroke();

    if(temp%10===0){
      ctx.fillStyle="#000";
      ctx.fillText(temp+"C",10,yy);
    }
  }

  // time grid 0-14min, 30s steps
  for(let sec=0;sec<=maxTime;sec+=30){
    let xx=x(sec);

    ctx.strokeStyle=sec%60===0 ? "#ddd" : "#f0f0f0";
    ctx.beginPath();
    ctx.moveTo(xx,T);
    ctx.lineTo(xx,T+H);
    ctx.stroke();

    if(sec%60===0){
      ctx.fillStyle="#000";
      ctx.fillText((sec/60)+"m",xx-10,T+H+25);
    }
  }

  // lower 1/3 guide
  ctx.strokeStyle="rgba(0,0,0,0.3)";
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(L,pfTop);
  ctx.lineTo(L+W,pfTop);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle="#666";
  ctx.fillText("Power/Fan zone",L+8,pfTop+14);

  // axis
  ctx.strokeStyle="#000";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(L,T);
  ctx.lineTo(L,T+H);
  ctx.lineTo(L+W,T+H);
  ctx.lineTo(L+W,T);
  ctx.stroke();

  // RoR right scale
  ctx.fillStyle="#666";
  ctx.font="12px Arial";
  for(let r=0;r<=30;r+=5){
    let yy=yRor(r);
    ctx.fillText(r,L+W+14,yy);
  }
  ctx.fillText("RoR",L+W+14,T+14);

  // BT line
  let b=btData();
  if(b.length>0){
    ctx.strokeStyle="#000";
    ctx.lineWidth=3;
    ctx.beginPath();

    b.forEach((d,i)=>{
      let xx=x(d.t);
      let yy=yTemp(d.bt);

      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();

    ctx.fillStyle="#000";
    ctx.font="14px Arial";

    b.forEach(d=>{
      let xx=x(d.t);
      let yy=yTemp(d.bt);

      ctx.beginPath();
      ctx.arc(xx,yy,5,0,Math.PI*2);
      ctx.fill();

      ctx.fillText(Math.round(d.bt)+"C",xx+7,yy-10);
    });
  }

  // RoR smooth line orange 50%
  let rr=smoothRor();
  if(rr.length>0){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="orange";
    ctx.lineWidth=3;
    ctx.beginPath();

    rr.forEach((d,i)=>{
      let xx=x(d.t);
      let yy=yRor(d.ror);

      if(i===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });

    ctx.stroke();
    ctx.restore();
  }

  // Power step line: red, 50%, lower 1/3
  let powerData=data.filter(d=>!isNaN(d.power)).sort((a,b)=>a.t-b.t);

  if(powerData.length>0){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="red";
    ctx.lineWidth=3;
    stepLine(powerData,"power",x,yPF);
    ctx.restore();

    ctx.fillStyle="rgba(255,0,0,0.75)";
    powerData.forEach(d=>{
      ctx.fillText("P"+d.power,x(d.t)+4,yPF(d.power)+12);
    });
  }

  // Fan step line: blue, 50%, lower 1/3
  let fanData=data.filter(d=>!isNaN(d.fan)).sort((a,b)=>a.t-b.t);

  if(fanData.length>0){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle="blue";
    ctx.lineWidth=3;
    stepLine(fanData,"fan",x,yPF);
    ctx.restore();

    ctx.fillStyle="rgba(0,0,255,0.75)";
    fanData.forEach(d=>{
      ctx.fillText("F"+d.fan,x(d.t)+4,yPF(d.fan)-10);
    });
  }

  // legend
  ctx.fillStyle="#000";
  ctx.font="14px Arial";
  ctx.fillText("BT: black / RoR: orange 50% / Power: red step 50% / Fan: blue step 50%",L+10,T+18);
}

draw();
</script>

</body>
</html>
