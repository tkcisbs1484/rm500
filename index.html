<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM500 Logger Base v1</title>
<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial;
  color:#222;
}
.card{
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  padding:10px 14px;
  margin:4px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#fff;
  font-size:15px;
}
input{
  padding:8px;
  margin:4px;
  width:90px;
  font-size:15px;
}
#time{
  font-size:44px;
  text-align:center;
  font-weight:bold;
}
canvas{
  width:100%;
  height:430px;
  background:white;
  border:2px solid #000;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">
  <div id="time">0:00</div>
  <button onclick="startTimer()">Timer Start</button>
  <button onclick="stopTimer()">Stop</button>
</div>

<div class="card">
  BT Temp
  <input id="bt" type="number" step="1">

  Power
  <input id="power" type="number" step="5">

  Fan
  <input id="fan" type="number" step="5">

  <button onclick="savePoint()">Save</button>
</div>

<div class="card">
  <canvas id="graph" width="1100" height="520"></canvas>
</div>

<script>
let running = false;
let startMs = 0;
let baseSec = 0;
let data = [];

const timeEl = document.getElementById("time");
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

function nowSec(){
  if(running){
    return baseSec + Math.floor((Date.now() - startMs) / 1000);
  }
  return baseSec;
}

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  let m = Math.floor(sec / 60);
  let s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function startTimer(){
  if(running) return;
  running = true;
  startMs = Date.now();
  loop();
}

function stopTimer(){
  baseSec = nowSec();
  running = false;
  timeEl.innerText = fmt(baseSec);
  draw();
}

function loop(){
  timeEl.innerText = fmt(nowSec());
  draw();

  if(running){
    requestAnimationFrame(loop);
  }
}

function savePoint(){
  let t = nowSec();

  let bt = parseFloat(document.getElementById("bt").value);
  let power = parseFloat(document.getElementById("power").value);
  let fan = parseFloat(document.getElementById("fan").value);

  if(isNaN(bt) && isNaN(power) && isNaN(fan)){
    return;
  }

  data.push({
    t: t,
    bt: bt,
    power: power,
    fan: fan
  });

  data.sort((a,b)=>a.t-b.t);

  document.getElementById("bt").value = "";
  document.getElementById("power").value = "";
  document.getElementById("fan").value = "";

  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let L = 70;
  let R = 30;
  let T = 25;
  let B = 55;

  let W = canvas.width - L - R;
  let H = canvas.height - T - B;

  let maxTime = 14 * 60;
  let maxTemp = 230;

  let x = sec => L + (sec / maxTime) * W;
  let yTemp = temp => T + H - (temp / maxTemp) * H;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // horizontal temp grid 0-230 C, 5 C steps
  ctx.font = "13px Arial";
  ctx.textBaseline = "middle";

  for(let temp=0; temp<=230; temp+=5){
    let yy = yTemp(temp);

    ctx.strokeStyle = temp % 10 === 0 ? "#ddd" : "#eee";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L, yy);
    ctx.lineTo(L+W, yy);
    ctx.stroke();

    if(temp % 10 === 0){
      ctx.fillStyle = "#000";
      ctx.fillText(temp + "C", 10, yy);
    }
  }

  // vertical time grid 0-14 min, 30 sec steps
  for(let sec=0; sec<=maxTime; sec+=30){
    let xx = x(sec);

    ctx.strokeStyle = sec % 60 === 0 ? "#ddd" : "#f0f0f0";
    ctx.beginPath();
    ctx.moveTo(xx, T);
    ctx.lineTo(xx, T+H);
    ctx.stroke();

    if(sec % 60 === 0){
      ctx.fillStyle = "#000";
      ctx.fillText((sec/60) + "m", xx-10, T+H+25);
    }
  }

  // axis
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(L, T);
  ctx.lineTo(L, T+H);
  ctx.lineTo(L+W, T+H);
  ctx.stroke();

  // BT line
  let btData = data.filter(d => !isNaN(d.bt));

  if(btData.length > 0){
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.beginPath();

    btData.forEach((d,i)=>{
      let xx = x(d.t);
      let yy = yTemp(d.bt);

      if(i === 0){
        ctx.moveTo(xx, yy);
      }else{
        ctx.lineTo(xx, yy);
      }
    });

    ctx.stroke();

    // BT points + labels
    ctx.fillStyle = "#000";
    ctx.font = "14px Arial";

    btData.forEach(d=>{
      let xx = x(d.t);
      let yy = yTemp(d.bt);

      ctx.beginPath();
      ctx.arc(xx, yy, 5, 0, Math.PI*2);
      ctx.fill();

      ctx.fillText(Math.round(d.bt) + "C", xx+7, yy-10);
    });
  }

  // Power line, 0-100 mapped to graph height
  let powerData = data.filter(d => !isNaN(d.power));

  if(powerData.length > 0){
    ctx.strokeStyle = "#444";
    ctx.lineWidth = 2;
    ctx.beginPath();

    powerData.forEach((d,i)=>{
      let xx = x(d.t);
      let yy = T + H - (d.power / 100) * H;

      if(i === 0){
        ctx.moveTo(xx, yy);
      }else{
        ctx.lineTo(xx, yy);
      }
    });

    ctx.stroke();
  }

  // Fan line, 0-100 mapped to graph height
  let fanData = data.filter(d => !isNaN(d.fan));

  if(fanData.length > 0){
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();

    fanData.forEach((d,i)=>{
      let xx = x(d.t);
      let yy = T + H - (d.fan / 100) * H;

      if(i === 0){
        ctx.moveTo(xx, yy);
      }else{
        ctx.lineTo(xx, yy);
      }
    });

    ctx.stroke();
    ctx.setLineDash([]);
  }

  // legend
  ctx.fillStyle = "#000";
  ctx.font = "14px Arial";
  ctx.fillText("BT: black / Power: dark line / Fan: dashed gray", L+10, T+18);
}

draw();
</script>

</body>
</html>
